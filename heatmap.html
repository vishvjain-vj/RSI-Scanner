<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live RSI Heatmap</title>
    <style>
        body { background-color: #0b141a; color: white; font-family: -apple-system, sans-serif; padding: 20px; margin: 0; }
        .header-container { text-align: center; margin-bottom: 25px; }
        h2 { color: #8899a6; margin-bottom: 5px; font-weight: 500; }
        .clock { font-size: 24px; font-weight: bold; color: #ffffff; letter-spacing: 1px; }
        .last-updated { font-size: 14px; color: #e67e22; margin-top: 5px; font-weight: 600; }

        .tf-controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
        .control-label { color: #8899a6; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-right: 5px; }
        .tf-btn { background-color: #1a2228; color: #8899a6; border: 1px solid #2c363f; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s; }
        .tf-btn:hover { background-color: #2c363f; color: white; }
        .tf-btn.active { background-color: #1f618d; color: white; border-color: #1f618d; box-shadow: 0 0 10px rgba(31, 97, 141, 0.4); }
        
        /* Specialized Sort Button Highlight */
        .sort-btn.active { background-color: #d35400; color: white; border-color: #d35400; box-shadow: 0 0 10px rgba(211, 84, 0, 0.4); }

        .management-deck { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .ticker-input-box { background-color: #1a2228; color: white; border: 1px solid #2c363f; padding: 8px 16px; border-radius: 20px; font-size: 14px; width: 260px; outline: none; }
        .ticker-input-box:focus { border-color: #1f618d; }
        .status-msg { text-align: center; font-size: 13px; height: 18px; margin-bottom: 25px; font-weight: 500; }

       /* ================= FULLY RESPONSIVE TRADING CARDS ================= */
        
        /* 1. Base Layout (Defaults to Large Screens & 15" Laptops) */
        #heatmap-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); 
            gap: 15px; 
            max-width: 1600px; /* Allows stretching on ultra-wide monitors */
            width: 98%; 
            margin: 0 auto; 
        }
        
        .stock-card { 
            position: relative; 
            border-radius: 8px; 
            padding: 20px 10px 15px 10px; 
            text-align: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
            transition: background-color 0.3s, transform 0.1s; 
        }
        
        .symbol { font-size: 17px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 8px; color: #ffffff; text-transform: uppercase; }
        .price-val { font-size: 25px; font-weight: 800; margin-bottom: 2px; letter-spacing: -0.5px; color: #ffffff; }
        .atp-val { font-size: 13px; color: #d1d5db; margin-bottom: 10px; font-weight: 600; letter-spacing: 0.5px; }
        .rsi-val { font-size: 14px; font-weight: 700; background: rgba(0, 0, 0, 0.3); display: inline-block; padding: 5px 12px; border-radius: 12px; letter-spacing: 0.5px; }

        /* ================= MEDIA QUERIES FOR DIFFERENT DEVICES ================= */

        /* 2. 13-Inch Laptops and Tablets (Screens smaller than 1280px) */
        @media (max-width: 1280px) {
            #heatmap-container { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
            .stock-card { padding: 16px 8px 12px 8px; }
            .symbol { font-size: 15px; margin-bottom: 6px; }
            .price-val { font-size: 22px; }
            .atp-val { font-size: 12px; margin-bottom: 8px; }
            .rsi-val { font-size: 13px; padding: 4px 10px; }
        }

        /* 3. Small Tablets & Large Phones (Screens smaller than 768px) */
        @media (max-width: 768px) {
            #heatmap-container { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
            .tf-controls { flex-direction: row; flex-wrap: wrap; justify-content: center; }
            .tf-btn { padding: 6px 12px; font-size: 12px; } /* Shrink buttons so they fit on mobile */
            .symbol { font-size: 14px; }
            .price-val { font-size: 18px; }
            .rsi-val { font-size: 12px; }
        }

        /* 4. Mobile Phones (Screens smaller than 480px) */
        @media (max-width: 480px) {
            /* Drops down to a comfortable 2-column layout on phones */
            #heatmap-container { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; width: 95%; }
            .header-container h2 { font-size: 20px; }
            .clock { font-size: 18px; }
            .last-updated { font-size: 11px; }
            .management-deck { flex-direction: column; align-items: center; } /* Stack the input box and button */
            .ticker-input-box { width: 90%; margin-bottom: 10px; }
        }
        .card-menu-container { position: absolute; top: 5px; right: 5px; }
        .dots-btn { background: none; border: none; color: rgba(255, 255, 255, 0.5); font-size: 18px; cursor: pointer; padding: 0px 8px; line-height: 1; transition: color 0.2s; }
        .dots-btn:hover { color: #ffffff; }
        .dropdown-menu { display: none; position: absolute; right: 0; top: 100%; background-color: #1a2228; border: 1px solid #2c363f; border-radius: 6px; box-shadow: 0 4px 8px rgba(0,0,0,0.4); z-index: 10; min-width: 90px; overflow: hidden; }
        .dropdown-menu.show { display: block; }
        .dropdown-item { padding: 10px 15px; color: #e74c3c; font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; transition: background-color 0.2s; }
        .dropdown-item:hover { background-color: #2c363f; color: #ff6b6b; }
    </style>
</head>
<body>

    <div class="header-container">
        <h2>Live Market Heatmap</h2>
        <div class="clock" id="live-clock">00:00:00</div>
        <div class="last-updated" id="last-updated">🛰️ Connection Idle. Please choose a timeframe to launch stream.</div>
    </div>

    <div class="tf-controls" id="tf-buttons">
        <span class="control-label">Interval:</span>
        <button class="tf-btn" onclick="changeTimeframe('1m', this)">1m</button>
        <button class="tf-btn" onclick="changeTimeframe('5m', this)">5m</button>
        <button class="tf-btn" onclick="changeTimeframe('15m', this)">15m</button>
        <button class="tf-btn" onclick="changeTimeframe('30m', this)">30m</button>
        <button class="tf-btn" onclick="changeTimeframe('1hr', this)">1hr</button>
        <button class="tf-btn" onclick="changeTimeframe('1D', this)">1D</button>
    </div>

    <div class="tf-controls" id="sort-buttons" style="margin-bottom: 25px;">
        <span class="control-label">Sort Order:</span>
        <button class="tf-btn sort-btn active" onclick="changeSort('az', this)">A → Z</button>
        <button class="tf-btn sort-btn" onclick="changeSort('za', this)">Z → A</button>
        <button class="tf-btn sort-btn" onclick="changeSort('rsi-high', this)">Highest RSI </button>
        <button class="tf-btn sort-btn" onclick="changeSort('rsi-low', this)">Lowest RSI </button>
        
        <button class="tf-btn sort-btn" onclick="changeSort('price-high', this)">Highest Price </button>
        <button class="tf-btn sort-btn" onclick="changeSort('price-low', this)">Lowest Price </button>
    </div>

    <div class="management-deck">
        <input type="text" id="ticker-input" list="ticker-suggestions" placeholder="Search Stocks..." class="ticker-input-box" oninput="handleTypeAhead()" onkeydown="if(event.key === 'Enter') addTicker()">
        <datalist id="ticker-suggestions"></datalist>
        <button class="tf-btn" style="margin:0;" onclick="addTicker()">Add Ticker</button>
    </div>
    <div id="action-status" class="status-msg"></div>

    <div id="heatmap-container"></div>

    <script>
        let currentTF = null;
        let currentSort = 'az'; // Default sort state tracking variable
        let debounceTimer;

        document.addEventListener('click', function(event) {
            if (!event.target.matches('.dots-btn')) {
                document.querySelectorAll('.dropdown-menu').forEach(menu => { menu.classList.remove('show'); });
            }
        });

        function toggleMenu(event, symbol) {
            event.stopPropagation(); 
            document.querySelectorAll('.dropdown-menu').forEach(menu => {
                if(menu.id !== `menu-${symbol}`) menu.classList.remove('show');
            });
            document.getElementById(`menu-${symbol}`).classList.toggle('show');
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleTimeString('en-US', { hour12: true });
        }
        setInterval(updateClock, 1000);
        updateClock();

        function getBackgroundColor(rsi) {
            if (rsi === null || rsi === undefined) return "#2c363f";
            if (rsi >= 75) return "#27632a"; 
            if (rsi >= 65) return "#3b8c3e"; 
            if (rsi >= 55) return "#1f618d"; 
            if (rsi >= 45) return "#2c363f"; 
            if (rsi >= 35) return "#c43131"; 
            return "#9e1b1b";                
        }

        function handleTypeAhead() {
            clearTimeout(debounceTimer);
            const queryValue = document.getElementById('ticker-input').value.trim();
            if (queryValue.length < 2) { document.getElementById('ticker-suggestions').innerHTML = ''; return; }

            debounceTimer = setTimeout(async () => {
                try {
                    const response = await fetch(`/search_ticker?q=${encodeURIComponent(queryValue)}`);
                    if (response.ok) {
                        const suggestions = await response.json();
                        const datalist = document.getElementById('ticker-suggestions');
                        datalist.innerHTML = '';
                        suggestions.forEach(symbol => {
                            const option = document.createElement('option');
                            option.value = symbol;
                            datalist.appendChild(option);
                        });
                    }
                } catch (err) { console.error("Fuzzy lookahead extraction error:", err); }
            }, 250);
        }

        async function addTicker() {
            const inputField = document.getElementById('ticker-input');
            const symbol = inputField.value.trim();
            const statusDiv = document.getElementById('action-status');

            if (!symbol) return;

            statusDiv.style.color = "#e67e22";
            statusDiv.innerText = `Registering ${symbol}...`;

            try {
                const response = await fetch('/add_ticker', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symbol: symbol })
                });
                const result = await response.json();

                if (response.ok && result.status === "success") {
                    statusDiv.style.color = "#2ecc71";
                    statusDiv.innerText = result.message;
                    inputField.value = '';
                    fetchDashboardData(); 
                } else {
                    statusDiv.style.color = "#e74c3c";
                    statusDiv.innerText = result.message || "Failed allocating symbol channels.";
                }
            } catch (err) {
                statusDiv.style.color = "#e74c3c";
                statusDiv.innerText = "Network error.";
            }
        }

        async function removeTicker(symbol) {
            try {
                await fetch('/remove_ticker', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symbol: symbol })
                });
                fetchDashboardData(); 
            } catch (err) { console.error("Remove failed", err); }
        }

        async function changeTimeframe(new_tf, btnElement) {
            document.querySelectorAll('.tf-btn:not(.sort-btn)').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            
            document.getElementById('last-updated').style.color = "#e67e22";
            document.getElementById('last-updated').innerText = `📡 Starting background fetch for ${new_tf}...`;
            
            document.getElementById('heatmap-container').innerHTML = ''; 

            try {
                const response = await fetch('/set_timeframe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ timeframe: new_tf })
                });
                const result = await response.json();

                if (result.status === "loading") {
                    // Engine is still logging in to Angel One (cold start on Fly.io)
                    // Auto-retry every 5s — no user action needed
                    document.getElementById('last-updated').style.color = "#e67e22";
                    document.getElementById('last-updated').innerText = `⏳ Engine warming up... retrying in 5s`;
                    setTimeout(() => changeTimeframe(new_tf, btnElement), 5000);
                    return;
                }

                if (result.status === "success") {
                    currentTF = result.active;
                    fetchDashboardData(); 
                }
            } catch (error) {
                // Network error — also retry so page self-heals
                document.getElementById('last-updated').style.color = "#e74c3c";
                document.getElementById('last-updated').innerText = `⚠️ Connection error — retrying in 5s`;
                setTimeout(() => changeTimeframe(new_tf, btnElement), 5000);
            }
        }

        // 🔥 NEW: Function to change current sort type and re-render data
        function changeSort(sortType, btnElement) {
            document.querySelectorAll('.sort-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
            currentSort = sortType;
            fetchDashboardData(); // Instantly apply sorting sequence layout
        }

        async function fetchDashboardData() {
            if (!currentTF) return;

            try {
                const response = await fetch('/get_dashboard');
                const result = await response.json();
                
                // 🛡️ SAFE: Case-insensitive matching prevents "1D" vs "1d" lockouts
                if (result.active_timeframe && result.active_timeframe.toLowerCase() === currentTF.toLowerCase()) {
                    const data = result.data;
                    const container = document.getElementById('heatmap-container');
                    
                    let entries = Object.entries(data);

                    // Execute Custom Sorting Sequences
                    // Execute Custom Sorting Sequences
                    entries.sort((a, b) => {
                        const symA = a[0];
                        const symB = b[0];
                        const statsA = a[1];
                        const statsB = b[1];

                        if (!statsA || !statsB) return 0;
                        
                        // 1. Alphabetical Sorting
                        if (currentSort === 'az') return symA.localeCompare(symB);
                        if (currentSort === 'za') return symB.localeCompare(symA);

                        // Extract safe numerical baselines for Indicators & Price
                        const rsiA = (statsA.status === "READY" && statsA.rsi !== null && statsA.rsi !== undefined) ? statsA.rsi : null;
                        const rsiB = (statsB.status === "READY" && statsB.rsi !== null && statsB.rsi !== undefined) ? statsB.rsi : null;
                        
                        const priceA = (statsA.status === "READY" && statsA.price !== null && statsA.price !== undefined) ? statsA.price : null;
                        const priceB = (statsB.status === "READY" && statsB.price !== null && statsB.price !== undefined) ? statsB.price : null;

                        // 2. RSI Sorting
                        if (currentSort === 'rsi-high') {
                            if (rsiA === null) return 1;
                            if (rsiB === null) return -1;
                            return rsiB - rsiA;
                        }
                        if (currentSort === 'rsi-low') {
                            if (rsiA === null) return 1;
                            if (rsiB === null) return -1;
                            return rsiA - rsiB;
                        }
                        
                        // 🔥 NEW: 3. Price Sorting
                        if (currentSort === 'price-high') {
                            if (priceA === null) return 1; // Push loading/errors to bottom
                            if (priceB === null) return -1;
                            return priceB - priceA;        // Descending (Highest First)
                        }
                        if (currentSort === 'price-low') {
                            if (priceA === null) return 1; // Push loading/errors to bottom
                            if (priceB === null) return -1;
                            return priceA - priceB;        // Ascending (Lowest First)
                        }
                        
                        return 0;
                    });

                    let isStillFetching = false;

                    for (const [symbol, stats] of entries) {
                        if (!stats) continue; 
                        
                        let card = document.getElementById(`card-${symbol}`);
                        let bgColor = "";
                        let rsiDisplay = "";
                        let priceDisplay = "---";
                        let atpDisplay = "ATP: ---"; // 🛡️ Default safe state for ATP

                        if (stats.status === "LOADING") {
                            isStillFetching = true; 
                            bgColor = "#1a2228"; 
                            rsiDisplay = `<span style="color:#f39c12">⏳ Loading...</span>`;
                            priceDisplay = "---";
                        } else if (stats.status === "ERROR") {
                            bgColor = "#c43131"; 
                            rsiDisplay = `<span style="color:#ffffff">⚠️ Fetch Failed</span>`;
                            priceDisplay = "---";
                        } else {
                            bgColor = getBackgroundColor(stats.rsi);
                            
                            // RSI Parse
                            const rsiVal = (stats.rsi !== null && stats.rsi !== undefined) ? stats.rsi.toFixed(2) : "N/A";
                            rsiDisplay = `RSI: ${rsiVal}`;
                            
                            // LTP Parse
                            priceDisplay = (stats.price !== null && stats.price !== undefined) ? `₹${stats.price.toFixed(2)}` : "---";
                            
                            // 🔥 NEW: ATP Parse
                            atpDisplay = (stats.atp !== null && stats.atp !== undefined) ? `ATP: ₹${stats.atp.toFixed(2)}` : "ATP: ---";
                        }

                        if (!card) {
                            card = document.createElement('div');
                            card.id = `card-${symbol}`;
                            card.className = 'stock-card';
                            
                            // 🔥 NEW: Added <div class="atp-val"></div> to the structure
                            card.innerHTML = `
                                <div class="card-menu-container">
                                    <button class="dots-btn" onclick="toggleMenu(event, '${symbol}')">⋮</button>
                                    <div class="dropdown-menu" id="menu-${symbol}">
                                        <div class="dropdown-item" onclick="removeTicker('${symbol}')">Remove</div>
                                    </div>
                                </div>
                                <div class="symbol">${symbol}</div>
                                <div class="price-val"></div>
                                <div class="atp-val"></div>
                                <div class="rsi-val"></div>
                            `;
                        }

                        card.style.backgroundColor = bgColor;
                        container.appendChild(card);
                        
                        // Push all three values to the UI
                        card.querySelector('.price-val').innerHTML = priceDisplay;
                        card.querySelector('.atp-val').innerHTML = atpDisplay; // 🔥 NEW
                        card.querySelector('.rsi-val').innerHTML = rsiDisplay;
                    }

                    // Remove deleted records cleanly
                    if (container.children.length > entries.length) {
                        const currentSymbols = entries.map(e => `card-${e[0]}`);
                        Array.from(container.children).forEach(child => {
                            if (!currentSymbols.includes(child.id)) {
                                container.removeChild(child);
                            }
                        });
                    }

                    // Handle Status Text Notifications & Audio Alarms Safely
                    const now = new Date();
                    const statusText = document.getElementById('last-updated');
                    
                    if (isStillFetching) {
                        fetchWasInProgress = true; 
                        statusText.style.color = "#f39c12"; 
                        statusText.innerText = `⏳ Background fetching in progress for ${currentTF}...`;
                    } else {
                        if (fetchWasInProgress === true) {
                            statusText.style.fontSize = "18px";
                            statusText.style.animation = "blink 0.5s 3"; 
                            
                            try {
                                let audioContext = new (window.AudioContext || window.webkitAudioContext)();
                                let oscillator = audioContext.createOscillator();
                                let gainNode = audioContext.createGain();
                                oscillator.connect(gainNode);
                                gainNode.connect(audioContext.destination);
                                oscillator.type = 'sine';
                                oscillator.frequency.setValueAtTime(587.33, audioContext.currentTime); 
                                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                                oscillator.start();
                                oscillator.stop(audioContext.currentTime + 0.15);
                            } catch(e) {}

                            fetchWasInProgress = false; 
                        }

                        statusText.style.fontSize = "14px";
                        statusText.style.color = "#2ecc71"; 
                        statusText.innerText = `📶 Live Stream Active | View: ${currentTF} | Sync: ${now.toLocaleTimeString()}`;
                    }
                }
            } catch (error) {
                console.log("Waiting for backend engine response...");
            }
        }

        setInterval(fetchDashboardData, 3000); 
    </script>
</body>
</html>
